<ion-content class="container">
  <h3 class="title">Estamos quase lá!</h3>

  <section class="form">
    <label class="label" for="password">Informe a sua senha:</label>
    <span class="email">Email: {{ emailValue.trim() }}</span>
    <div class="password-field">
      <input
        id="password"
        [type]="passwordVisible ? 'text' : 'password'"
        class="input"
        placeholder="Senha"
        autocomplete="current-password"
        [(ngModel)]="passwordValue">
      <button
        type="button"
        class="password-toggle"
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="passwordVisible ? 'Ocultar senha' : 'Mostrar senha'"
        [attr.aria-pressed]="passwordVisible">
        <i class="fa-regular fa-eye icon" style="color: #232323;" *ngIf="passwordVisible"></i>
        <i class="fa-regular fa-eye-slash icon" style="color: #232323;" *ngIf="!passwordVisible"></i>
      </button>
    </div>

    <ion-checkbox class="checkbox" label-placement="end">Lembrar de mim</ion-checkbox>
  </section>

  <button class="btn"
  routerLink="/patient/"
  [disabled]="!passwordValue.trim()"
  [class.disabled]="!passwordValue.trim()">Entrar</button>

  <a routerLink="" class="a"><span>Esqueceu a senha?</span></a>
  <a routerLink="/login/email" class="a"><span>Alterar email</span></a>
</ion-content>
