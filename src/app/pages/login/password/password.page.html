<ion-content class="container">
  <form (ngSubmit)="OnSubmit()">
    <h3 class="title">Estamos quase lá!</h3>

    @if (flow === 'new_password_login') {
      <span class="label">Digite a sua nova senha para fazer login</span>
    }
    @else {
      <span class="label">Digite a sua senha para fazer login</span>
    }

    <section class="form">
      <label for="password" class="label">Senha:</label>
      <span class="email">E-mail: {{ email.trim() }}</span>
      <app-password-input
        name="password"
        label=""
        placeholder="Sua senha"
        [(value)]="passwordValue"
        autocomplete="current-password">
      </app-password-input>

      <ion-checkbox class="checkbox" label-placement="end">Lembrar de mim</ion-checkbox>
    </section>

    <app-loading-button type="submit"
    [loading]="loading"
    content="Entrar"
    (btnClick)="RedirectToHome()"></app-loading-button>
  </form>

    <a class="a" (click)="RedirectToResetPasswordCodeValidation()"><span>Esqueceu a senha?</span></a>
    
    <a routerLink="/login/email" class="a"><span>Alterar e-mail</span></a>
</ion-content>
