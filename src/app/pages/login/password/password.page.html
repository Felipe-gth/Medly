<ion-content class="container">
  <h3 class="title">Estamos quase lá!</h3>

  <section class="form">
    <label class="label" for="password">Informe a sua senha:</label>
    <span class="email">Email: {{ emailValue.trim() }}</span>
    <app-password-input
      placeholder="Senha"
      [(value)]="passwordValue">
    </app-password-input>

    <ion-checkbox class="checkbox" label-placement="end">Lembrar de mim</ion-checkbox>
  </section>

  <button class="btn"
  routerLink="/patient/"
  [disabled]="!passwordValue.trim()"
  [class.disabled]="!passwordValue.trim()">Entrar</button>

  <a routerLink="" class="a"><span>Esqueceu a senha?</span></a>
  <a routerLink="/login/email" class="a"><span>Alterar email</span></a>
</ion-content>
