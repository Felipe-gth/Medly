<ion-content class="container">
  <h3 class="title">Que bom ter você de volta!</h3>

  <section class="form">
    <label class="label">Informe seu e-mail:</label>

    <input type="email"
      id="email"
      name="email"
      class="input"
      required
      appEmailValidator
      placeholder="seuemail@exmeplo.com"
      [(ngModel)]="emailValue"
      #emailInput="ngModel">

    @if (emailInput.errors?.['invalidEmail'] && emailInput.dirty) {
      <span class="error-text" >
        Por favor, insira um e-mail válido.
      </span>
    }
  </section>

  <button class="btn" (click)="ToPasswordPage()"
  [disabled]="emailInput.invalid"
  [class.disabled]="emailInput.invalid">Continuar</button>

  <a routerLink="/register" class="a"><span>Ainda não possuo uma conta</span></a>

  <div class="login-divider">
    <span>ou continue com</span>
  </div>
</ion-content>
