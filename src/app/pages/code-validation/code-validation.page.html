<ion-content class="container">
  <form (ngSubmit)="OnSubmit()">
    <h3 class="title">Cheque seu e-mail</h3>

    <span class="label">Enviamos um código</span> 
    <span class="email">E-mail: {{ email.trim() }}</span>

    <section class="form">
      @if (flow === 'reset_password') {
        <label for="code" class="label">Redefinir senha:</label>
      }
      @else {
        <label for="code" class="label">Fazer login com código:</label>
      }
    
      <input 
        id="code"
        name="code"
        type="text"
        class="input"
        placeholder="XXXXXX"
        autocomplete="one-time-code"
        [(ngModel)]="code"
        #codeInput="ngModel"
        maxlength="6">
    </section>

    <app-loading-button type="submit"
      [loading]="loading"
      [content]="flow === 'reset_password' ? 'Continuar' : 'Entrar'"
      (btnClick)="flow === 'reset_password' ? RedirectToResetPasswordPage() : RedirectToHome()">
    </app-loading-button>

    <button [disabled]="isTimerRunning"
      [class.disabled]="isTimerRunning"
      class="resend-btn"
      (click)="ReSendCode()">
      @if (isTimerRunning) {
        Reenviar cógido em: {{ remainingTime }}s
      }
      @else {
        Reenviar código
      }
    </button>
    

    <a (click)="RedirectToPasswordLoginPage()"><span class="a">{{ flow === 'reset_password' ? '' : 'Entrar com senha' }}</span></a>
  </form>
</ion-content>
