<ion-content class="container">
  <form (ngSubmit)="OnSubmit()">
    <h3 class="title">Um código foi enviado ao email:</h3>

    <span class="label">{{ emailValue }}</span>

    <section class="form">
      <!-- O atributo 'for' aponta para o 'id' do input -->
      <label for="codeValue" class="label">Informe o código:</label>
    
      <input 
        id="codeValue"
        name="codeValue"
        type="text"
        class="input"
        placeholder="XXX-XXX"
        autocomplete="one-time-code"
        [(ngModel)]="codeValue"
        #codeInput="ngModel"
        maxlength="6">
    </section>

    <!-- O formulário cuida do envio via (ngSubmit), não precisa de (click) aqui -->
    <button class="btn"
      type="submit"
      [disabled]="codeValue.length !== 6"
      [class.disabled]="codeValue.length !== 6">
      Enviar</button>
  </form>
</ion-content>
