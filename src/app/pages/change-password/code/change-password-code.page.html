<ion-content class="container">
  <h3 class="title">Um código foi enviado ao email:</h3>
  <span class="label">{{ emailValue }}</span>

  <section class="form">
    <label class="label">Informe o código:</label>
    
    <input type="text" 
      class="input" 
      placeholder="XXX-XXX" 
      [(ngModel)]="codeValue"
      #codeInput="ngModel"
      maxlength="6">
  </section>

  <button class="btn"
  routerLink="/patient"
  [disabled]="codeValue.length !== 6"
  [class.disabled]="codeValue.length !== 6"
  (click)="ToNewPasswordPage()">Enviar</button>
</ion-content>
